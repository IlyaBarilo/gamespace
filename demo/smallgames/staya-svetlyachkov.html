<head>

<title>Стая светлячков</title>
<style>
:root{--scale:1;--ink:#f7fbf8;--muted:#cfe0d5;--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06100f;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--ink)}
button{font:inherit}
#gameRoot{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none;background:radial-gradient(circle at 50% 40%,#10231d 0,#071411 50%,#030807 100%)}
#gameFrame{position:absolute;left:50%;top:50%;width:810px;height:1440px;transform:translate(-50%,-50%) scale(var(--scale));transform-origin:center center;overflow:hidden;touch-action:none;background:#071713;border-radius:4px}

.hudLabel{font-size:20px;line-height:1.05;color:var(--muted);letter-spacing:.02em}
.hudValue{margin-top:3px;font-size:34px;font-weight:850;line-height:1}
#hudRight{text-align:right}
#stageName{position:absolute;top:118px;left:50%;transform:translateX(-50%);max-width:650px;font-size:28px;font-weight:850;text-align:center;text-shadow:0 2px 12px rgba(0,0,0,.9);pointer-events:none;transition:opacity .35s ease}
#hint{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);width:680px;padding:13px 22px;border-radius:27px;background:rgba(4,12,10,.64);border:1px solid rgba(255,255,255,.13);font-size:24px;font-weight:700;text-align:center;line-height:1.25;text-shadow:0 2px 8px rgba(0,0,0,.7);pointer-events:none;transition:opacity .45s ease}

#exitButton:focus-visible,#restartButton:focus-visible{outline:4px solid rgba(255,255,255,.9);outline-offset:4px}

.hidden{display:none!important}

<body>
<div id="gameRoot">

    <canvas id="gameCanvas" aria-label="Игра Стая светлячков"></canvas>

        <div id="finishPanel" data-ui="true">

          <button id="restartButton" class="ui" data-ui="true" type="button">Играть ещё раз</button>
        </div>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
const BASE_W=810,BASE_H=1440,HAS_POINTER='PointerEvent' in window;
function readDifficulty(){const raw=new URLSearchParams(window.location.search).get('diff');const v=Number(raw);return Number.isInteger(v)&&v>=1&&v<=5?v:3}
const DIFF={
  1:{required:.55,wind:.72,obstacle:.92,cohesion:1.22,returnPull:1.30,webHold:.82,webOff:6.0,targetRadius:142,gapScale:1.14},
  2:{required:.61,wind:.86,obstacle:.96,cohesion:1.12,returnPull:1.18,webHold:.95,webOff:5.3,targetRadius:136,gapScale:1.07},
  3:{required:.68,wind:1.00,obstacle:1.00,cohesion:1.00,returnPull:1.00,webHold:1.10,webOff:4.6,targetRadius:128,gapScale:1.00},
  4:{required:.75,wind:1.15,obstacle:1.04,cohesion:.92,returnPull:.90,webHold:1.25,webOff:4.0,targetRadius:120,gapScale:.94},
  5:{required:.82,wind:1.30,obstacle:1.08,cohesion:.86,returnPull:.82,webHold:1.40,webOff:3.4,targetRadius:112,gapScale:.89}
};
const CONFIG={difficulty:readDifficulty(),swarm:50,maxSpeed:138,maxAccel:390,particleMax:500,edgeMargin:92,stageHold:.90,controlRadius:360,controlFade:120,webRescueHold:1.05,webImmunity:1.85};
Object.assign(CONFIG,DIFF[CONFIG.difficulty]);
const root=document.getElementById('gameRoot'),frame=document.getElementById('gameFrame'),canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const stageValue=document.getElementById('stageValue'),swarmValue=document.getElementById('swarmValue'),stageName=document.getElementById('stageName'),hint=document.getElementById('hint');
const overlay=document.getElementById('finishOverlay'),finishTitle=document.getElementById('finishTitle'),finishText=document.getElementById('finishText'),restartButton=document.getElementById('restartButton'),exitButton=document.getElementById('exitButton');
let scale=1,backingScale=1,last=performance.now(),activePointer=null,pointerHeld=false;
const pressedKeys=new Set();
const state={active:false,finished:false,stage:0,stageHold:0,transition:0,transitionMode:'',markerVisible:false,marker:{x:405,y:1120},fireflies:[],particles:[],ripples:[],stars:[],webs:[],audioCtx:null,master:null,centroid:{x:405,y:1120},nearTarget:0,current:null};

function mushroomRow(items){return items.map(v=>[v[0],v[1],v[2]||34])}
const stages=[
 {name:'Лети за мной',hint:'Веди палец рядом со стаей и доведи всех светлячков до цветка',start:[405,1120],target:[405,250],required:.55,trees:[],mushrooms:[],wind:[],webs:[]},
 {name:'Между деревьями',hint:'Проведи всех светлячков через проход — они сами огибают стволы',start:[405,1160],target:[405,225],required:.60,trees:[[115,760,128],[695,760,128],[405,590,112]],mushrooms:[],wind:[],webs:[]},
 {name:'Высокая трава',hint:'Ищи просветы между густой травой и проведи всю стаю к цветку',start:[405,1180],target:[405,220],required:.64,trees:[],mushrooms:mushroomRow([[10,894,22],[50,906,23],[90,894,24],[130,906,22],[170,894,23],[210,906,24],[300,894,22],[340,906,23],[380,894,24],[420,906,22],[460,894,23],[550,906,24],[590,894,22],[630,906,23],[670,894,24],[710,906,22],[750,894,23],[790,906,24],[10,674,22],[50,686,23],[90,674,24],[130,686,22],[220,674,23],[260,686,24],[300,674,22],[340,686,23],[380,674,24],[420,686,22],[460,674,23],[500,686,24],[590,674,22],[630,686,23],[670,674,24],[710,686,22],[750,674,23],[790,686,24],[10,464,22],[50,476,23],[90,464,24],[130,476,22],[170,464,23],[210,476,24],[250,464,22],[290,476,23],[380,464,24],[420,476,22],[460,464,23],[500,476,24],[540,464,22],[630,476,23],[670,464,24],[710,476,22],[750,464,23],[790,476,24]]),wind:[],webs:[]},
 {name:'Ночной ветер',hint:'Ветер сносит стаю — веди палец против потока и используй дерево как укрытие',start:[405,1180],target:[405,215],required:.64,trees:[[405,720,128],[120,450,105],[690,450,105]],mushrooms:[],wind:[{x:0,y:930,w:810,h:245,fx:315,fy:-30},{x:0,y:520,w:810,h:255,fx:-340,fy:18}],webs:[]},
 {name:'Липкие паутины',hint:'Облетай паутины. Если светлячки прилипли — удерживай палец рядом, чтобы освободить их',start:[405,1190],target:[405,205],required:.66,trees:[[100,760,92],[710,760,92]],mushrooms:mushroomRow([[35,950,22],[85,950,22],[135,950,22],[185,950,22],[625,950,22],[675,950,22],[725,950,22],[775,950,22],[35,465,22],[85,465,22],[135,465,22],[675,465,22],[725,465,22],[775,465,22]]),wind:[],webs:[[310,845,92],[515,615,92],[315,400,78]]},
 {name:'Старый лес',hint:'Проведи стаю вокруг старого дерева, через травяные ворота и против лёгкого ветра',start:[405,1195],target:[405,195],required:.74,trees:[[405,790,178],[90,530,112],[720,530,112]],mushrooms:mushroomRow([[35,980,22],[85,980,22],[135,980,22],[355,980,22],[405,980,22],[455,980,22],[675,980,22],[725,980,22],[775,980,22],[35,355,22],[85,355,22],[135,355,22],[185,355,22],[625,355,22],[675,355,22],[725,355,22],[775,355,22]]),wind:[{x:0,y:600,w:810,h:260,fx:112,fy:0}],webs:[[210,505,74],[600,505,74]]},
 {name:'Лунная тропа',hint:'Финальный путь: ветер, паутина и узкие проходы — собери стаю у Лунного цветка',start:[405,1200],target:[405,178],required:.78,trees:[[115,910,110],[695,910,110],[405,655,154]],mushrooms:mushroomRow([[35,1060,22],[85,1060,22],[135,1060,22],[185,1060,22],[575,1060,22],[625,1060,22],[675,1060,22],[725,1060,22],[775,1060,22],[35,420,22],[85,420,22],[135,420,22],[355,420,22],[405,420,22],[455,420,22],[675,420,22],[725,420,22],[775,420,22]]),wind:[{x:0,y:760,w:810,h:245,fx:-245,fy:12},{x:0,y:300,w:810,h:205,fx:205,fy:-8}],webs:[[240,555,78],[570,555,78]],final:true}
];

function scaledStage(src){
 return {...src,
   trees:(src.trees||[]).map(t=>({x:t[0],y:t[1],r:t[2]*CONFIG.obstacle,seed:Math.random()*10})),
   mushrooms:(src.mushrooms||[]).map((m,i)=>({x:m[0],y:m[1],r:m[2]*CONFIG.obstacle/CONFIG.gapScale,seed:i*1.77+Math.random()})),
   wind:(src.wind||[]).map(w=>({...w,fx:w.fx*CONFIG.wind,fy:(w.fy||0)*CONFIG.wind})),
   webs:(src.webs||[]).map((w,i)=>({x:w[0],y:w[1],r:w[2]*CONFIG.obstacle,charge:0,cooldown:0,pulse:0,id:i}))
 };
}
function applyScale(){
 const w=window.innerWidth,h=window.innerHeight;scale=Math.min(w/BASE_W,h/BASE_H);document.documentElement.style.setProperty('--scale',scale.toFixed(5));
 const dpr=Math.max(1,window.devicePixelRatio||1);backingScale=Math.min(2.5,Math.max(1,dpr*scale));canvas.width=Math.round(BASE_W*backingScale);canvas.height=Math.round(BASE_H*backingScale);canvas.style.width=BASE_W+'px';canvas.style.height=BASE_H+'px';ctx.setTransform(backingScale,0,0,backingScale,0,0);
}
function logicalFromClient(x,y){const r=frame.getBoundingClientRect();return{x:Math.max(0,Math.min(BASE_W,(x-r.left)/r.width*BASE_W)),y:Math.max(155,Math.min(BASE_H,(y-r.top)/r.height*BASE_H))}}
function isUiTarget(t){return !!(t&&t.closest&&t.closest('.ui,[data-ui="true"]'))}
function isEditable(t){return !!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"]'))}
function clearInput(){const hadControl=pointerHeld||pressedKeys.size>0;pressedKeys.clear();pointerHeld=false;activePointer=null;state.markerVisible=false;if(hadControl&&state.fireflies&&state.fireflies.length)rememberIdlePositions()}
function controlActive(){return pointerHeld||pressedKeys.size>0}
function initStars(){state.stars=[];for(let i=0;i<105;i++)state.stars.push({x:Math.random()*BASE_W,y:Math.random()*BASE_H,r:.5+Math.random()*1.7,a:.10+Math.random()*.28,p:Math.random()*8})}
function spawnSwarm(start){
 state.fireflies.length=0;
 for(let i=0;i<CONFIG.swarm;i++){
  const a=Math.random()*Math.PI*2,rr=Math.pow(Math.random(),.72)*76,ang=Math.random()*Math.PI*2;
  const x=start[0]+Math.cos(a)*rr,y=start[1]+Math.sin(a)*rr*.64,seed=Math.random()*1000;
  state.fireflies.push({x,y,vx:Math.cos(ang)*8,vy:Math.sin(ang)*8,angle:ang,seed,r:4.15+Math.random()*1.55,side:Math.random()<.5?-1:1,webImmune:0,captured:false,captureAngle:0,captureRadius:0,idleX:x,idleY:y,speedMul:.91+Math.random()*.18,steerMul:.90+Math.random()*.20,wanderR:9+Math.random()*15,wanderRate:.45+Math.random()*.45,wanderPhase:Math.random()*Math.PI*2});
 }
 state.centroid.x=start[0];state.centroid.y=start[1];swarmValue.textContent='0 / '+CONFIG.swarm;
}

function rememberIdlePositions(){
 for(const f of state.fireflies)if(!f.captured){f.idleX=f.x;f.idleY=f.y;f.vx*=.78;f.vy*=.78}
}

function resetParticles(){state.particles.length=0;state.ripples.length=0}
function startStage(index){
 state.stage=index;state.current=scaledStage(stages[index]);state.webs=state.current.webs;state.marker.x=state.current.start[0];state.marker.y=state.current.start[1];state.markerVisible=false;state.stageHold=0;state.nearTarget=0;clearInput();spawnSwarm(state.current.start);resetParticles();
 stageValue.textContent=(index+1)+' / '+stages.length;stageName.textContent=state.current.name;hint.textContent=state.current.hint;stageName.style.opacity='1';hint.style.opacity='1';
}
function restart(){state.active=true;state.finished=false;state.transition=0;state.transitionMode='';overlay.classList.add('hidden');startStage(0);last=performance.now()}
function finishGame(){if(state.finished)return;state.active=false;state.finished=true;clearInput();finishTitle.textContent='Лунный цветок проснулся!';finishText.textContent='Ты провёл стаю через все 7 полян ночного леса.';overlay.classList.remove('hidden');playChord()}
function exitGame(){state.active=false;clearInput();if(window.self!==window.top){window.parent.postMessage({type:'gameExit'},'*');return}if(window.history.length>1){window.history.back();return}exitButton.disabled=true;exitButton.textContent='Нет страницы для возврата'}

function ensureAudio(){if(state.audioCtx)return;const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;try{state.audioCtx=new AC();state.master=state.audioCtx.createGain();state.master.gain.value=.10;state.master.connect(state.audioCtx.destination)}catch(_){state.audioCtx=null}}
function tone(freq,dur=.10,vol=.10,type='sine',delay=0){ensureAudio();const ac=state.audioCtx;if(!ac||!state.master)return;if(ac.state==='suspended')ac.resume().catch(()=>{});const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(state.master);o.start(t);o.stop(t+dur+.03)}
function playTap(){tone(500,.06,.045)}function playWeb(){tone(700,.12,.07,'triangle');tone(920,.12,.04,'sine',.08)}function playStage(){tone(440,.15,.08);tone(660,.18,.07,'sine',.10);tone(880,.24,.06,'triangle',.20)}function playChord(){tone(392,.7,.09);tone(523.25,.75,.07,'sine',.08);tone(659.25,.8,.06,'triangle',.16)}
function addRipple(x,y,warm=true){state.ripples.push({x,y,r:12,life:1,warm})}
function burst(x,y,n=18,warm=true){for(let i=0;i<n&&state.particles.length<CONFIG.particleMax;i++){const a=Math.random()*Math.PI*2,s=25+Math.random()*95;state.particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:1.4+Math.random()*3,life:.45+Math.random()*.65,max:1,warm})}}
function pointLineDistance(px,py,ax,ay,bx,by){const abx=bx-ax,aby=by-ay,len2=abx*abx+aby*aby||1,t=Math.max(0,Math.min(1,((px-ax)*abx+(py-ay)*aby)/len2)),qx=ax+abx*t,qy=ay+aby*t;return{d:Math.hypot(px-qx,py-qy),t,qx,qy}}
function webAtFirefly(f){
 if(f.webImmune>0)return null;
 for(const w of state.webs)if(Math.hypot(f.x-w.x,f.y-w.y)<w.r*.90)return w;
 return null;
}
function inTreeShelter(f,z){
 const mag=Math.hypot(z.fx,z.fy)||1,wx=z.fx/mag,wy=z.fy/mag;
 for(const o of state.current.trees){const dx=f.x-o.x,dy=f.y-o.y,along=dx*wx+dy*wy,cross=Math.abs(dx*(-wy)+dy*wx);if(along>o.r*.45&&along<o.r*2.2&&cross<o.r*.72)return true}
 return false;
}
function limitAccel(ax,ay,max){const a=Math.hypot(ax,ay);return a>max?[ax/a*max,ay/a*max]:[ax,ay]}
function avoidCircle(f,o,marker){
 let ax=0,ay=0,ox=f.x-o.x,oy=f.y-o.y,od=Math.hypot(ox,oy)||.001;const influence=o.r+72;
 if(od<influence){const q=(influence-od)/influence;ax+=ox/od*q*q*760;ay+=oy/od*q*q*760}
 if(marker){const line=pointLineDistance(o.x,o.y,f.x,f.y,marker.x,marker.y);if(line.t>.03&&line.t<.97&&line.d<o.r+38){const dx=marker.x-f.x,dy=marker.y-f.y,dl=Math.hypot(dx,dy)||1,tx=-dy/dl*f.side,ty=dx/dl*f.side,q=1-line.d/(o.r+38);ax+=tx*q*225;ay+=ty*q*225}}
 return[ax,ay];
}
function collideCircle(f,o,pad=4){let ox=f.x-o.x,oy=f.y-o.y,od=Math.hypot(ox,oy)||.001,rr=o.r+pad;if(od<rr){const nx=ox/od,ny=oy/od;f.x=o.x+nx*rr;f.y=o.y+ny*rr;const vn=f.vx*nx+f.vy*ny;if(vn<0){f.vx-=vn*nx*1.25;f.vy-=vn*ny*1.25}f.vx+=-ny*f.side*12;f.vy+=nx*f.side*12}}

function updateMarker(dt){
 let dx=0,dy=0;if(pressedKeys.has('ArrowLeft')||pressedKeys.has('KeyA'))dx--;if(pressedKeys.has('ArrowRight')||pressedKeys.has('KeyD'))dx++;if(pressedKeys.has('ArrowUp')||pressedKeys.has('KeyW'))dy--;if(pressedKeys.has('ArrowDown')||pressedKeys.has('KeyS'))dy++;
 if(dx||dy){if(!state.markerVisible){state.marker.x=state.centroid.x;state.marker.y=state.centroid.y}const l=Math.hypot(dx,dy)||1;state.marker.x=Math.max(18,Math.min(BASE_W-18,state.marker.x+dx/l*360*dt));state.marker.y=Math.max(165,Math.min(BASE_H-18,state.marker.y+dy/l*360*dt));state.markerVisible=true}
 if(!controlActive())state.markerVisible=false;
}
function rescueWeb(w){
 const marker=state.marker;
 let dx=marker.x-w.x,dy=marker.y-w.y,dl=Math.hypot(dx,dy)||1;
 dx/=dl;dy/=dl;
 let rescued=0;
 for(const f of state.fireflies){
  if(Math.hypot(f.x-w.x,f.y-w.y)<w.r*1.04){
   f.webImmune=CONFIG.webImmunity;
   const jitter=(Math.random()-.5)*.75,cs=Math.cos(jitter),sn=Math.sin(jitter),rx=dx*cs-dy*sn,ry=dx*sn+dy*cs;
   f.vx=rx*(92+Math.random()*34);f.vy=ry*(92+Math.random()*34);rescued++;
  }
 }
 w.charge=0;w.cooldown=.75;w.pulse=1;
 if(rescued){burst(w.x,w.y,Math.min(28,10+Math.floor(rescued*.25)),false);addRipple(w.x,w.y,false);playWeb()}
}
function updateWebs(dt){
 for(const w of state.webs){
  w.cooldown=Math.max(0,w.cooldown-dt);w.pulse=Math.max(0,w.pulse-dt*1.8);
  const nearby=state.markerVisible&&controlActive()&&Math.hypot(state.marker.x-w.x,state.marker.y-w.y)<w.r*1.05;
  if(nearby&&w.cooldown<=0){w.charge+=dt;if(w.charge>=CONFIG.webRescueHold)rescueWeb(w)}
  else w.charge=Math.max(0,w.charge-dt*1.1);
 }
}
function enforceFireflySpacing(){
 const F=state.fireflies;
 // Soft personal space: brief overlap is allowed, but deep overlap gently resolves.
 for(let i=0;i<F.length;i++)for(let j=i+1;j<F.length;j++){
  const a=F[i],b=F[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001;
  const bodyDist=(a.r+b.r)*1.18;
  const hardDist=(a.r+b.r)*.92;
  if(d>=bodyDist)continue;
  const nx=dx/d,ny=dy/d;

 window.addEventListener('keyup',e=>{if(pressedKeys.has(e.code)){pressedKeys.delete(e.code);if(!pressedKeys.size){state.markerVisible=false;rememberIdlePositions()} if(state.active&&e.cancelable)e.preventDefault()}},{passive:false});window.addEventListener('blur',clearInput);document.addEventListener('visibilitychange',()=>{if(document.hidden)clearInput()});
}
function bindUiButton(button,handler){let lastRun=0;button.addEventListener('pointerdown',e=>{e.stopPropagation()},{passive:false});button.addEventListener('pointerup',e=>{if(e.cancelable)e.preventDefault();e.stopPropagation();lastRun=performance.now();handler()},{passive:false});button.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();if(performance.now()-lastRun>450)handler()})}
window.addEventListener('contextmenu',e=>{if(frame.contains(e.target))e.preventDefault()});window.addEventListener('resize',applyScale);
bindUiButton(restartButton,restart);bindUiButton(exitButton,exitGame);bindInput();bindKeyboard();initStars();applyScale();restart();requestAnimationFrame(frameLoop);
})();
</script>
