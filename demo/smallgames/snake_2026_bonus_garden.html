<body>
<div id="gameRoot"><div id="stage">
  <canvas id="sceneCanvas" aria-label="Бонусная трёхмерная Змейка во фруктовом саду"></canvas>
  <div id="sceneAtmosphere"></div><div id="collectFlash"></div><div id="snout"><div id="snoutHead"><span class="nostril left"></span><span class="nostril right"></span></div></div><div id="crosshair"></div>

  </div>
</div></div>
<script>
(()=>{
'use strict';
const HAS_POINTER_EVENTS='PointerEvent' in window;
const REDUCED_MOTION=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);
function readDifficulty(){const raw=new URLSearchParams(location.search).get('diff');const v=Number(raw);return Number.isInteger(v)&&v>=1&&v<=5?v:3}
function readUiMode(){const value=new URLSearchParams(location.search).get('ui');return value==='mobile'||value==='tv'?value:''}
const difficulty=readDifficulty();
const REQUESTED_UI_MODE=readUiMode();
const DIFF={
  1:{step:.43,target:1600,time:80,obstacles:17,fruits:8},
  2:{step:.39,target:1900,time:78,obstacles:19,fruits:8},
  3:{step:.35,target:2200,time:75,obstacles:21,fruits:8},
  4:{step:.31,target:2500,time:72,obstacles:23,fruits:9},
  5:{step:.28,target:2800,time:70,obstacles:25,fruits:9}
}[difficulty];
const CONFIG={difficulty,baseStepInterval:DIFF.step,targetScore:DIFF.target,roundTime:DIFF.time,startLength:7,speedGain:.0018,minStep:.235,gridSize:30,cameraHeight:.88,bodyRadius:.31,obstacleCount:DIFF.obstacles,fruitCount:DIFF.fruits,comboWindow:4.4};
const FRUIT_TYPES=[
  {id:'apple',name:'ЯБЛОКО',points:100,growth:1,weight:38,color:[.96,.10,.08],beacon:[1,.30,.22],css:'#ff5e53'},
  {id:'pear',name:'ГРУША',points:140,growth:1,weight:25,color:[.70,.91,.18],beacon:[.74,1,.30],css:'#b9ef4e'},
  {id:'orange',name:'АПЕЛЬСИН',points:180,growth:1,weight:20,color:[1,.42,.035],beacon:[1,.60,.12],css:'#ff9a32'},
  {id:'berries',name:'ЯГОДЫ',points:240,growth:1,weight:13,color:[.44,.17,.88],beacon:[.69,.42,1],css:'#a779ff'},
  {id:'gold',name:'ЗОЛОТОЙ ФРУКТ',points:500,growth:2,weight:4,color:[1,.73,.08],beacon:[1,.88,.30],css:'#ffd75a'}
];
const root=document.getElementById('gameRoot'),canvas=document.getElementById('sceneCanvas');
const snout=document.getElementById('snout'),exitButton=document.getElementById('exitButton'),soundButton=document.getElementById('soundButton'),scoreText=document.getElementById('scoreText'),fruitText=document.getElementById('fruitText'),goalText=document.getElementById('goalText'),timeText=document.getElementById('timeText'),targetIndicator=document.getElementById('targetIndicator'),comboIndicator=document.getElementById('comboIndicator'),pickupText=document.getElementById('pickupText'),collectFlash=document.getElementById('collectFlash');
const finishOverlay=document.getElementById('finishOverlay'),finishTitle=document.getElementById('finishTitle'),finishReason=document.getElementById('finishReason'),finishStats=document.getElementById('finishStats'),restartButton=document.getElementById('restartButton'),srStatus=document.getElementById('srStatus');
const layout={w:810,h:1440,uiScale:1,field:{x:16,y:96,w:778,h:1332}};
const state={gameActive:false,finished:false,success:false,score:0,collected:0,timeLeft:CONFIG.roundTime,snake:[],prevSnake:[],direction:{x:0,y:-1},prevDirection:{x:0,y:-1},queuedTurn:0,foods:[],obstacles:[],decor:[],growthPending:0,pulse:0,collectFlash:0,pickupTimer:0,pickupColor:'#fff',combo:1,comboTime:0,bestCombo:1,distanceTravelled:0};
let lastFrameTime=performance.now(),gameAccumulator=0,activePointerId=null,pointerStart=null,mouseFallbackActive=false,soundEnabled=true,audioContext=null,renderer=null;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}function lerp(a,b,t){return a+(b-a)*t}function randInt(max){return Math.floor(Math.random()*max)}function manhattan(a,b){return Math.abs(a.x-b.x)+Math.abs(a.y-b.y)}
function isUiTarget(t){return !!(t&&t.closest&&t.closest('.button,.panel,.overlay,[data-ui="true"]'))}function isEditableTarget(t){return !!(t&&t.closest&&t.closest('input,textarea,select,[contenteditable="true"]'))}function clearInputState(){activePointerId=null;pointerStart=null;mouseFallbackActive=false}function u(n){return n*layout.uiScale}
function automaticUiMode(w,h){const shortSide=Math.min(w,h),longSide=Math.max(w,h),coarse=!!(window.matchMedia&&window.matchMedia('(pointer: coarse)').matches);return coarse&&shortSide>=1000&&longSide>=1700?'tv':!coarse&&shortSide>=1300&&longSide>=2200?'tv':coarse||shortSide<700?'mobile':'auto'}
function applyLayout(){layout.w=Math.max(1,window.visualViewport?.width||innerWidth);layout.h=Math.max(1,window.visualViewport?.height||innerHeight);const portrait=layout.h>=layout.w,baseW=portrait?810:1440,baseH=portrait?1440:810,fitted=Math.min(layout.w/baseW,layout.h/baseH),uiMode=REQUESTED_UI_MODE||automaticUiMode(layout.w,layout.h);layout.uiScale=uiMode==='tv'?Math.max(1.5,fitted):uiMode==='mobile'?1:Math.max(1,fitted);document.documentElement.dataset.uiMode=uiMode;const style=document.documentElement.style,set=(k,v)=>style.setProperty(k,`${v}px`);
  set('--top-pad',u(10));set('--top-side',u(12));set('--button-w',u(82));set('--button-h',u(48));set('--button-font',u(16));set('--button-radius',u(12));set('--title-top',u(10));set('--title-font',u(22));set('--hud-top',u(70));set('--hud-font',u(19));
  const fieldTop=u(104),side=u(16),bottom=u(12);layout.field={x:side,y:fieldTop,w:Math.max(u(240),layout.w-side*2),h:Math.max(u(260),layout.h-fieldTop-bottom)};set('--field-x',layout.field.x);set('--field-y',layout.field.y);set('--field-w',layout.field.w);set('--field-h',layout.field.h);set('--field-radius',u(18));
  set('--overlay-pad',u(20));set('--overlay-gutter',u(24));set('--finish-panel-w',u(620));set('--finish-pad-y',u(28));set('--finish-pad-x',u(24));set('--finish-kicker-font',u(16));set('--finish-title-font',u(40));set('--finish-reason-font',u(18));set('--finish-stats-font',u(17));set('--restart-h',u(54));set('--restart-font',u(19));set('--indicator-font',u(16));set('--combo-font',u(16));set('--pickup-font',u(34));resizeCanvas()}
function resizeCanvas(){const dpr=Math.max(1,Math.min(3,devicePixelRatio||1));canvas.width=Math.max(1,Math.round(layout.field.w*dpr));canvas.height=Math.max(1,Math.round(layout.field.h*dpr));if(renderer)renderer.resize(canvas.width,canvas.height,dpr)}
function snakeOccupies(x,y){return state.snake.some(s=>s.x===x&&s.y===y)}function obstacleAt(x,y){return state.obstacles.find(o=>o.x===x&&o.y===y)}function fruitAt(x,y){return state.foods.find(f=>f.x===x&&f.y===y)}
function freeCell(x,y,ignoreFruit=null){return x>=1&&x<CONFIG.gridSize-1&&y>=1&&y<CONFIG.gridSize-1&&!snakeOccupies(x,y)&&!obstacleAt(x,y)&&!state.foods.some(f=>f!==ignoreFruit&&f.x===x&&f.y===y)}
function generateObstacles(){state.obstacles=[];const cx=Math.floor(CONFIG.gridSize/2),cy=Math.floor(CONFIG.gridSize*.68);let tries=0;while(state.obstacles.length<CONFIG.obstacleCount&&tries<9000){tries++;const x=randInt(CONFIG.gridSize-4)+2,y=randInt(CONFIG.gridSize-4)+2;if(Math.hypot(x-cx,y-cy)<6.5)continue;if(Math.abs(x-cx)<=1&&y>cy-7&&y<cy+3)continue;if(state.obstacles.some(o=>Math.abs(o.x-x)+Math.abs(o.y-y)<3))continue;const r=Math.random(),type=r<.60?'tree':r<.84?'rock':'stump';state.obstacles.push({x,y,type,variant:Math.random()})}}
function generateDecor(){state.decor=[];const half=(CONFIG.gridSize-1)/2;for(let i=0;i<54;i++){let x=(Math.random()*CONFIG.gridSize)-half,z=(Math.random()*CONFIG.gridSize)-half;const cx=Math.round(x+half),cy=Math.round(z+half);if(obstacleAt(cx,cy)||Math.hypot(cx-CONFIG.gridSize/2,cy-CONFIG.gridSize*.68)<3){i--;continue}state.decor.push({x,z,type:Math.random()<.24?'flower':'grass',h:.14+Math.random()*.20,hue:Math.random()})}}
function chooseFruitType(){const hasGold=state.foods.some(f=>f.type&&f.type.id==='gold');let pool=FRUIT_TYPES,roll=Math.random()*pool.reduce((s,t)=>s+(hasGold&&t.id==='gold'?0:t.weight),0);for(const t of pool){const w=hasGold&&t.id==='gold'?0:t.weight;if((roll-=w)<=0)return t}return FRUIT_TYPES[0]}

  draw(name,model,color,kind,alpha=1,emissive=0){const gl=this.gl,m=this.meshes[name];gl.depthMask(alpha>=.99);gl.bindBuffer(gl.ARRAY_BUFFER,m.v);gl.enableVertexAttribArray(this.loc.aPos);gl.vertexAttribPointer(this.loc.aPos,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ARRAY_BUFFER,m.n);gl.enableVertexAttribArray(this.loc.aNormal);gl.vertexAttribPointer(this.loc.aNormal,3,gl.FLOAT,false,0,0);gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,m.i);gl.uniformMatrix4fv(this.loc.uModel,false,model);gl.uniform3fv(this.loc.uColor,new Float32Array(color));gl.uniform1f(this.loc.uKind,kind);gl.uniform1f(this.loc.uAlpha,alpha);gl.uniform1f(this.loc.uEmissive,emissive);gl.drawElements(gl.TRIANGLES,m.count,gl.UNSIGNED_SHORT,0);gl.depthMask(true)}
  fallback(frame){const c=this.ctx;if(!c)return;const W=layout.field.w,H=layout.field.h,dpr=canvas.width/Math.max(1,W);c.setTransform(dpr,0,0,dpr,0,0);c.clearRect(0,0,W,H);const horizon=H*(layout.h>=layout.w?.30:.34),focal=Math.min(W*1.05,H*.82),camX=frame.head.x,camZ=frame.head.z,camY=CONFIG.cameraHeight,cy=Math.cos(frame.yaw),sy=Math.sin(frame.yaw),project=(x,y,z)=>{const dx=x-camX,dz=z-camZ,rx=dx*cy+dz*sy,depth=dx*sy-dz*cy;if(depth<=.12)return null;return{x:W*.5+rx/depth*focal,y:horizon-(y-camY)/depth*focal,d:depth}};const sky=c.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#72d4ff');sky.addColorStop(.30,'#cff4ff');sky.addColorStop(.305,'#8ac66a');sky.addColorStop(1,'#397638');c.fillStyle=sky;c.fillRect(0,0,W,H);c.save();c.strokeStyle='rgba(238,255,216,.48)';c.lineWidth=Math.max(.7,layout.uiScale);c.beginPath();const half=CONFIG.gridSize/2;for(let gx=-half;gx<=half;gx++){let on=false;for(let gz=-half;gz<=half;gz++){const p=project(gx,0,gz);if(p){if(!on){c.moveTo(p.x,p.y);on=true}else c.lineTo(p.x,p.y)}else on=false}}for(let gz=-half;gz<=half;gz++){let on=false;for(let gx=-half;gx<=half;gx++){const p=project(gx,0,gz);if(p){if(!on){c.moveTo(p.x,p.y);on=true}else c.lineTo(p.x,p.y)}else on=false}}c.stroke();c.restore();
