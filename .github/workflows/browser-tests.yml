name: GameSpace browser tests

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        default: ''
        type: string
      release_date:
        default: ''
        type: string

permissions:
  contents: read

jobs:
  browser:
    name: Browser tests — ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [interface, runtime, fps]
    defaults:
      run:
        working-directory: pwa-gamespace
    steps:
      - name: Check out tested source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pwa-gamespace/package-lock.json

      - name: Apply the release version
        if: inputs.version != ''
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_DATE: ${{ inputs.release_date }}
        run: npm run version:apply -- "$RELEASE_VERSION" "$RELEASE_DATE"

      - name: Install exact dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the isolated browser test group
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: npm run test:e2e -- --project="$TEST_GROUP"

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ matrix.group }}
          path: pwa-gamespace/test-results/
          if-no-files-found: ignore
          retention-days: 7
