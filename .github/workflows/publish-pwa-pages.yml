name: Publish GameSpace release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag to retry, for example v0.4
        required: true
        type: string

concurrency:
  group: gamespace-release
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

permissions:
  contents: read

jobs:
  validate:
    name: Validate published release
    if: ${{ github.event_name != 'release' || !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release_version.outputs.version }}
      release_date: ${{ steps.release_date.outputs.date }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Require a published stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease)"
          test "$(jq -r .tagName <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .isDraft <<<"$release")" = "false"
          test "$(jq -r .isPrerelease <<<"$release")" = "false"

      - name: Read GameSpace version from release tag
        id: release_version
        working-directory: pwa-gamespace
        run: node scripts/read-release-version.mjs "$RELEASE_TAG" --github-output

      - name: Use the tagged commit date
        id: release_date
        run: echo "date=$(git show -s --format=%cs HEAD)" >> "$GITHUB_OUTPUT"

  pwa:
    name: Verify and package PWA
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pwa-gamespace
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pwa-gamespace/package-lock.json

      - name: Apply the shared release version
        run: npm run version:apply -- "${{ needs.validate.outputs.version }}" "${{ needs.validate.outputs.release_date }}"

      - name: Install exact dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests
        run: npm run test:e2e

      - name: Build current source
        run: npm run build

      - name: Restore published immutable PWA releases and prepare the current package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p release-packages
          published_tags="$(gh release list --limit 100 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[].tagName')"
          while IFS= read -r tag; do
            [[ "$tag" == v* ]] || continue
            if ! version="$(node scripts/read-release-version.mjs "$tag" 2>/dev/null)"; then
              continue
            fi
            asset="gamespace-pwa-${version}.tar.gz"
            release="$(gh release view "$tag" --json assets)"
            if ! jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' <<<"$release" >/dev/null; then
              echo "::notice::Release ${tag} has no PWA package yet; skipping download."
              continue
            fi
            download_dir="${RUNNER_TEMP}/gamespace-${version}"
            mkdir -p "$download_dir" "release-packages/${version}"
            gh release download "$tag" --pattern "$asset" --dir "$download_dir"
            tar -xzf "${download_dir}/${asset}" -C "release-packages/${version}"
          done <<<"$published_tags"

          export GAMESPACE_RELEASE_DESCRIPTION="$(gh release view "$RELEASE_TAG" --json body --jq .body)"
          if [[ ! -f "release-packages/${RELEASE_VERSION}/release.json" ]]; then
            node scripts/prepare-release.mjs "$RELEASE_VERSION"
          fi
          node scripts/verify-runtime.mjs
          node scripts/verify-releases.mjs
          node scripts/verify-release-source.mjs "$RELEASE_VERSION"

          asset="gamespace-pwa-${RELEASE_VERSION}.tar.gz"
          if [[ -f "${RUNNER_TEMP}/gamespace-${RELEASE_VERSION}/${asset}" ]]; then
            cp "${RUNNER_TEMP}/gamespace-${RELEASE_VERSION}/${asset}" .
          else
            tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
              -czf "${RUNNER_TEMP}/${asset}" -C "release-packages/${RELEASE_VERSION}" .
            cp "${RUNNER_TEMP}/${asset}" .
          fi

      - name: Assemble release-only Pages artifact
        run: npm run pages:assemble -- "${{ needs.validate.outputs.version }}"

      - name: Upload immutable PWA package for publication
        uses: actions/upload-artifact@v4
        with:
          name: pwa-release-asset
          path: pwa-gamespace/gamespace-pwa-${{ needs.validate.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pwa-gamespace/pages-output/${{ needs.validate.outputs.version }}

  apk:
    name: Verify and package signed APK
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run APK diagnostics
        shell: pwsh
        run: .\apk-gamespace\tests\test-diagnostics.ps1

      - name: Ensure required Android SDK packages
        shell: pwsh
        run: |
          $sdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          if (-not $sdkRoot) { throw "ANDROID_SDK_ROOT is not configured on the runner." }
          $platform = Join-Path $sdkRoot "platforms\android-36\android.jar"
          $buildTools = Join-Path $sdkRoot "build-tools\36.0.0\aapt2.exe"
          if (-not (Test-Path -LiteralPath $platform) -or -not (Test-Path -LiteralPath $buildTools)) {
            $sdkManager = Get-ChildItem -LiteralPath (Join-Path $sdkRoot "cmdline-tools") -Recurse -Filter "sdkmanager.bat" |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $sdkManager) { throw "sdkmanager.bat was not found." }
            & $sdkManager.FullName "--sdk_root=$sdkRoot" "platforms;android-36" "build-tools;36.0.0"
            if ($LASTEXITCODE -ne 0) { throw "Android SDK package installation failed." }
          }

      - name: Restore the existing APK signing key
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.GAMESPACE_APK_KEYSTORE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.GAMESPACE_APK_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.GAMESPACE_APK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.GAMESPACE_APK_KEY_PASSWORD }}
        run: |
          foreach ($name in @("KEYSTORE_BASE64", "KEYSTORE_ALIAS", "KEYSTORE_PASSWORD", "KEY_PASSWORD")) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required GitHub Actions secret is missing: $name"
            }
          }
          $keystorePath = Join-Path $env:RUNNER_TEMP "gamespace-release.keystore"
          [IO.File]::WriteAllBytes($keystorePath, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
          "GAMESPACE_KEYSTORE_PATH=$keystorePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build signed APK with the shared release version
        shell: pwsh
        env:
          KEYSTORE_ALIAS: ${{ secrets.GAMESPACE_APK_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.GAMESPACE_APK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.GAMESPACE_APK_KEY_PASSWORD }}
        run: |
          & .\apk-gamespace\build-apk.ps1 `
            -VersionName "${{ needs.validate.outputs.version }}" `
            -KeystorePath $env:GAMESPACE_KEYSTORE_PATH `
            -KeystorePassword $env:KEYSTORE_PASSWORD `
            -KeyAlias $env:KEYSTORE_ALIAS `
            -KeyPassword $env:KEY_PASSWORD `
            -RequireExistingKeystore

          $assetDirectory = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\gamespace-apk-assets" -Force
          Copy-Item -LiteralPath ".\apk-gamespace\release\GameSpace.apk" -Destination (Join-Path $assetDirectory "GameSpace-${{ needs.validate.outputs.version }}.apk")
          Copy-Item -LiteralPath ".\apk-gamespace\release\GameSpace.apk" -Destination (Join-Path $assetDirectory "GameSpace-latest.apk")

      - name: Verify and reuse APKs already attached to this release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $release = gh release view $env:RELEASE_TAG --json assets | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "Cannot read release assets." }
          $names = @("GameSpace-$env:RELEASE_VERSION.apk", "GameSpace-latest.apk")
          $existing = @($names | Where-Object { $_ -in $release.assets.name })
          if ($existing.Count -eq 0) { exit 0 }

          $sdkRoot = if ($env:ANDROID_SDK_ROOT) { $env:ANDROID_SDK_ROOT } else { $env:ANDROID_HOME }
          $apksigner = Join-Path $sdkRoot "build-tools\36.0.0\apksigner.bat"
          $aapt = Join-Path $sdkRoot "build-tools\36.0.0\aapt2.exe"
          function Get-ApkIdentity([string]$file) {
            $signature = & $apksigner verify --verbose --print-certs $file
            if ($LASTEXITCODE -ne 0) { throw "Published APK signature verification failed: $file" }
            $certificates = @($signature | Select-String 'Signer #\d+ certificate SHA-256 digest: ([0-9a-f]+)' | ForEach-Object { $_.Matches[0].Groups[1].Value })
            if ($certificates.Count -eq 0) { throw "APK signer certificate is missing: $file" }
            $badging = & $aapt dump badging $file
            if ($LASTEXITCODE -ne 0) { throw "Cannot read APK metadata: $file" }
            $identity = [regex]::Match(($badging -join "`n"), "(?m)^package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'").Value
            if (-not $identity) { throw "APK package identity is missing: $file" }
            return "$identity|$($certificates -join ',')"
          }

          $expectedIdentity = Get-ApkIdentity ".\apk-gamespace\release\GameSpace.apk"
          $downloadDirectory = New-Item -ItemType Directory -Path "$env:RUNNER_TEMP\gamespace-existing-apks" -Force
          foreach ($name in $existing) {
            gh release download $env:RELEASE_TAG --pattern $name --dir $downloadDirectory.FullName
            if ($LASTEXITCODE -ne 0) { throw "Cannot download published APK: $name" }
            if ((Get-ApkIdentity (Join-Path $downloadDirectory $name)) -ne $expectedIdentity) {
              throw "Published APK version, package or signing certificate differs from the tagged build: $name"
            }
          }
          $original = Join-Path $downloadDirectory $existing[0]
          foreach ($name in $existing) {
            if ((Get-FileHash -LiteralPath (Join-Path $downloadDirectory $name)).Hash -ne (Get-FileHash -LiteralPath $original).Hash) {
              throw "Published versioned and latest APKs are not identical."
            }
          }
          foreach ($name in $names) {
            Copy-Item -LiteralPath $original -Destination (Join-Path "$env:RUNNER_TEMP\gamespace-apk-assets" $name)
          }

      - name: Upload APKs for publication
        uses: actions/upload-artifact@v4
        with:
          name: apk-release-assets
          path: ${{ runner.temp }}/gamespace-apk-assets/*.apk
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Attach verified assets to the published release
    needs: [validate, pwa, apk]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download prepared release assets
        uses: actions/download-artifact@v4
        with:
          pattern: '*-release-asset*'
          merge-multiple: true
          path: release-assets

      - name: Attach and verify files only after both builds pass
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          release="$(gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease,assets)"
          test "$(jq -r .tagName <<<"$release")" = "$RELEASE_TAG"
          test "$(jq -r .isDraft <<<"$release")" = "false"
          test "$(jq -r .isPrerelease <<<"$release")" = "false"
          test -s "release-assets/gamespace-pwa-${RELEASE_VERSION}.tar.gz"
          test -s "release-assets/GameSpace-${RELEASE_VERSION}.apk"
          test -s "release-assets/GameSpace-latest.apk"
          cmp "release-assets/GameSpace-${RELEASE_VERSION}.apk" "release-assets/GameSpace-latest.apk"
          tar -tzf "release-assets/gamespace-pwa-${RELEASE_VERSION}.tar.gz" >/dev/null
          assets=("gamespace-pwa-${RELEASE_VERSION}.tar.gz" "GameSpace-${RELEASE_VERSION}.apk" "GameSpace-latest.apk")
          mkdir -p "${RUNNER_TEMP}/existing-release-assets" "${RUNNER_TEMP}/verified-release-assets"
          missing=()
          for asset in "${assets[@]}"; do
            if jq -e --arg asset "$asset" 'any(.assets[]; .name == $asset)' <<<"$release" >/dev/null; then
              gh release download "$RELEASE_TAG" --pattern "$asset" --dir "${RUNNER_TEMP}/existing-release-assets"
              cmp "release-assets/${asset}" "${RUNNER_TEMP}/existing-release-assets/${asset}"
            else
              missing+=("release-assets/${asset}")
            fi
          done
          if ((${#missing[@]})); then
            gh release upload "$RELEASE_TAG" "${missing[@]}"
          fi
          for asset in "${assets[@]}"; do
            gh release download "$RELEASE_TAG" --pattern "$asset" --dir "${RUNNER_TEMP}/verified-release-assets"
            cmp "release-assets/${asset}" "${RUNNER_TEMP}/verified-release-assets/${asset}"
          done

  deploy:
    name: Deploy the published PWA release
    needs: [publish, pwa]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
